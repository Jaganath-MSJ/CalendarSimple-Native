name: CI Pipeline

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Vitest 5 and Expo SDK 58 need Node 22.12+.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      # Once is enough; the bundle does not depend on the Node version.
      - run: npm run size
        if: matrix.node-version == '22.x'
      - run: npm pack --dry-run

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run example:web:export
      - run: npx playwright test -c e2e-web
