name: E2E (Android)

# Too slow (about 30 min) for every PR: runs on PRs into beta and main, or by hand.
on:
  pull_request:
    branches: [beta, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The release build plus the emulator image fill the default runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Build example Android app
        working-directory: example
        run: |
          npx expo prebuild -p android
          cd android && ./gradlew assembleRelease
      # Keep only the APK; the Gradle outputs and caches would leave the
      # emulator without room for its userdata partition.
      - name: Free build space
        run: |
          cp example/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          (cd example/android && ./gradlew --stop) || true
          rm -rf example/android ~/.gradle/caches
          df -h /
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/app-release.apk"
            maestro test e2e
