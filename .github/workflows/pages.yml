name: Deploy Live Demo

on:
  # semantic-release publishes with GITHUB_TOKEN, whose events (release:
  # published) never trigger workflows; follow the publish run instead.
  # Only stable releases from main update the live demo.
  workflow_run:
    workflows: ["Publish Package"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer release waits instead of cancelling a
# deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The released commit on workflow_run; the dispatched ref otherwise.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      # GitHub Pages serves the repo under /CalendarSimple-Native/
      # (example/app.config.js sets Expo's experiments.baseUrl from this).
      - run: npm run example:web:export
        env:
          EXPO_BASE_URL: /CalendarSimple-Native
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
